# Mutation testing for the security core.
#
# `cargo test` answers "does the code do what the tests say?". This answers the
# question that actually matters here: "would the tests NOTICE if it stopped?".
# Those are different questions, and the difference is not academic in this
# repository. Reversing one sort in `Masker::finish_build` left the whole suite
# green and made the binary print a secret in clear. Emptying `Drop for Secret`
# left the whole suite green and deleted the scrubbing guarantee the README
# advertises. Coverage would have called every one of those lines covered,
# because they WERE executed — just never in a way whose result anyone checked.
#
# The Python hook pack has had an automated mutation harness for months
# (`hooks/tests/mutations.json`). The Rust half was mutation-tested BY HAND, and
# a hand campaign runs when somebody remembers. That asymmetry is why survivors
# accumulated unnoticed. This file closes it.
#
# ---------------------------------------------------------------------------
# Why this is a SEPARATE workflow, and advisory rather than required
# ---------------------------------------------------------------------------
#
# It is not in `ci.yml` on purpose. Adding a job there adds a check context, and
# whether a context blocks a merge is a branch-protection setting rather than
# anything this file can say. Keeping it separate means the required set is
# unchanged until someone deliberately changes it, and it keeps a job of this
# length out of the workflow every push waits on.
#
# Measured on 2026-08-09, an M-series Mac, `--jobs 2`, on a baseline of 5s build
# + 23s test: a WHOLE campaign of 304 mutants finished in 36 minutes — about
# seven seconds each.
#
#   scope of this job     320 mutants   ~38 min
#   whole crate          ~1250 mutants   ~2.6 h
#
# Do not derive either figure from a short sample. A 16-mutant probe on this
# same machine ran at fifteen seconds a mutant, which extrapolates to 76 minutes
# for this scope — twice the truth. Consecutive mutants in one file reuse an
# incremental build, so the per-mutant cost FALLS as the campaign runs and a
# linear extrapolation from the first few is always pessimistic. Re-measure with
# a full run, and expect a shared runner to be slower than this Mac either way.
#
# ---------------------------------------------------------------------------
# WHERE THE CAMPAIGN RUNS, and what a local one costs
# ---------------------------------------------------------------------------
#
# THIS workflow is the campaign of record. `.github/mutants-baseline.txt` used
# to open with a local `cargo mutants` line, and people ran it, because that is
# what the file told them to do.
#
# The timings above are wall-clock on an idle machine and they are not what a
# shared workstation experiences. Measured while three sessions ran campaigns
# locally: one held the machine's job queue for eighty minutes producing no
# output, another drove it to critical memory pressure and was killed, and two
# unrelated sessions never got a slot for their own typecheck. A runner is
# waiting on nobody, which is the whole argument.
#
# A local run is still the right tool for debugging THIS FILE — the invocation
# is right below and `--copy-vcs true` is part of it. Nothing in the repository
# can refuse a `cargo mutants` typed into a shell, and pretending otherwise
# would be a rule that gets ignored. What the repository CAN do, and now does,
# is stop telling people to run one, and make the output harmless when somebody
# does: `.gitignore` drops this tool's artefacts, because an un-ignored campaign
# lands in the published corpus `tests/publication.rs` reads and reds the
# timestamp gate with its own logs.
#
# So a per-push gate on the whole crate is out of the question, and even the
# scoped run is too slow to sit in front of every merge. There is a second
# reason, and it is the one that would eventually get a gate switched off: a
# mutant that makes a loop run forever is classified by a TIMEOUT, and a timeout
# on a shared runner measures the neighbours. This repository already refused to
# gate on the hook pack's latency layer for exactly that reason. A verdict that
# flips with the load on somebody else's job is not a verdict.
#
# ---------------------------------------------------------------------------
# What is asserted, and what is deliberately not
# ---------------------------------------------------------------------------
#
# The set of SURVIVING mutants is diffed against a checked-in baseline, in both
# directions, the same way the XNU symbol surface is diffed in `ci.yml`:
#
#   * a survivor that is not in the baseline  -> red. A guard was lost, or new
#     code arrived unguarded.
#   * a baseline entry that no longer survives -> red. Somebody closed a gap and
#     the file still claims it is open. A stale baseline is how a gate becomes
#     decoration.
#
# The mutant COUNT is asserted too, because `-f` takes globs: rename a file and
# the globs match nothing, cargo-mutants tests zero mutants, reports zero
# survivors, and exits 0. A survivor list that agrees with an empty baseline is
# indistinguishable from a suite that was never run.
#
# TIMEOUTs are printed and never failed on — see the load argument above. They
# are listed in the log so a mutant that starts timing out instead of being
# caught is visible to a reader, which is as far as this job can honestly go.
#
# UNVIABLE mutants (the mutated code does not compile) are not failures either.
# They are cargo-mutants proving the type system already refuses that edit.
#
# ---------------------------------------------------------------------------
# The survivor key has NO LINE NUMBER, and that is the load-bearing decision
# ---------------------------------------------------------------------------
#
# cargo-mutants writes `missed.txt` as
#
#   src/mask/mod.rs:123:32: replace < with <= in Masker::add
#
# Diffing THAT against a checked-in file makes the gate fire on every edit that
# shifts a line — adding a comment to `src/mask/mod.rs` restates every baseline
# entry in the file as both a new survivor and a closed one, in one commit that
# changed no behaviour at all. A gate that reds on a comment is a gate somebody
# deletes, and a deleted gate protects nothing.
#
# So the key is `<path>: <mutation>` with the line and column stripped, and
# identical keys are collapsed with a COUNT in front:
#
#   2 <TAB> src/mask/mod.rs: replace < with <= in Masker::add
#
# The count is what keeps the collapse honest. Two identical mutations in one
# function are one key, so without it, closing one of the two would leave the
# baseline unchanged and the gate silent. With it, 2 becomes 1 and the diff
# reds. What this key genuinely cannot see is one survivor closing while a
# second, identical one appears elsewhere in the same function in the same
# commit. That is the price of not reding on comments, and it is worth paying.
#
# ---------------------------------------------------------------------------
# Scope: the three modules where a wrong answer is silent
# ---------------------------------------------------------------------------
#
#   src/mask/**    a wrong answer prints a credential
#   src/secret.rs  a wrong answer leaves plaintext in freed memory
#   src/audit/**   a wrong answer writes a record that is not true
#
# Everything else in the crate fails loudly: a broken store lookup produces an
# error, a broken CLI produces a usage message, a broken daemon refuses to
# start. Those are worth mutating too, and the whole crate is hours rather than
# minutes, so they are what `workflow_dispatch` with an empty scope is for — run
# the whole crate by hand when there is a reason to, rather than never because
# it is always too expensive to be automatic. A run whose scope is not the
# default is REPORTED and never diffed: the baseline describes one scope, and
# checking it against a different one would red every time and mean nothing.

name: Mutants

on:
  # The routine cadence. Nothing in a scheduled run can block a merge, which is
  # the point.
  schedule:
    - cron: '17 4 * * 1'
  # By hand, for a whole-crate run or after a large refactor.
  workflow_dispatch:
    inputs:
      scope:
        description: 'Files to mutate. Empty means the whole crate (~2.6h).'
        required: false
        default: 'src/mask/** src/secret.rs src/audit/**'
  # And on a change to the security core itself, because that is the one moment
  # a lost guard is cheap to find.
  pull_request:
    paths:
      - 'src/mask/**'
      - 'src/secret.rs'
      - 'src/audit/**'
      - '.github/mutants-baseline.txt'
      - '.github/workflows/mutants.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.89.0
  # Pinned, and not for reproducibility theatre: the tool's mutation operators
  # are what decide the mutant set, so a new version changes the baseline this
  # job diffs against. An unpinned tool would red on a day nobody pushed.
  MUTANTS_VERSION: 27.1.0
  # Set below the measured mutant count, so it catches a scope that COLLAPSED
  # rather than a scope that lost a function. Raise it with the baseline when
  # the security core grows.
  MUTANT_FLOOR: 280
  # The one scope `.github/mutants-baseline.txt` describes. Any other scope is
  # reported and never diffed — see the verification step.
  DEFAULT_SCOPE: 'src/mask/** src/secret.rs src/audit/**'

jobs:
  mutants:
    name: mutation testing (security core)
    runs-on: ubuntu-latest
    # ~38 minutes measured for the default scope; the whole crate is ~2.6h. The
    # ceiling is here so a mutant that wedges the runner is bounded by something
    # smaller than GitHub's 6-hour default.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Cache the cargo registry
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      # Keyed on the version, so a bump reinstalls and nothing else does.
      - name: Cache cargo-mutants
        id: mutants-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: ${{ runner.os }}-cargo-mutants-${{ env.MUTANTS_VERSION }}

      - name: Install cargo-mutants
        if: steps.mutants-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-mutants --locked --version "$MUTANTS_VERSION"

      - name: Run the mutants
        env:
          SCOPE: ${{ github.event.inputs.scope == null && env.DEFAULT_SCOPE || github.event.inputs.scope }}
        run: |
          set -uo pipefail
          files=""
          for glob in $SCOPE; do files="$files -f $glob"; done
          echo "scope:${files:-<whole crate>}"

          # `--jobs 2` on a 4-CPU runner, not 4. Each job is a whole cargo build
          # plus a whole test run; oversubscribing does not finish sooner and it
          # inflates the timeouts this job refuses to judge on.
          #
          # The generous timeout multiplier is the same argument: the default is
          # 5x the baseline test time, and 5x a baseline measured on a busy
          # runner is not much.
          #
          # The exit code is read on its own line. cargo-mutants exits non-zero
          # when mutants survive, and survivors are the NORMAL state here --
          # what decides this job is the diff below, never this status.
          # `--copy-vcs true` is load-bearing, not tidiness. cargo-mutants
          # copies the source tree WITHOUT `.git`, and `tests/publication.rs`
          # walks the published history — a walk that fails rather than skips
          # outside a checkout, deliberately, because a walk that read nothing
          # and a clean history are the same empty result. Without this flag the
          # UNMUTATED baseline fails, cargo-mutants tests zero mutants, and the
          # step below reports no outcomes.json at all. Measured on this repo:
          # exit 4, `total_mutants` 0, seven history cases red in the baseline.
          #
          # shellcheck disable=SC2086
          cargo mutants $files \
            --copy-vcs true \
            --jobs 2 \
            --timeout-multiplier 8 \
            --output mutants-run \
            > mutants.log 2>&1
          status=$?
          echo "cargo-mutants exited $status"
          tail -n 40 mutants.log

          # The one status that IS decided here: cargo-mutants never ran, or
          # died before writing its results. Without this the next step fails
          # on a missing file and reports a Python traceback instead of the
          # build error that actually happened.
          if [ ! -f mutants-run/mutants.out/outcomes.json ]; then
            echo "::error::cargo-mutants produced no outcomes.json (exit $status)."
            echo "::error::It did not get as far as testing mutants. The end of"
            echo "::error::its log is above; the whole log is in the artifact."
            exit 1
          fi

      - name: The surviving mutants are exactly the ones we said they were
        env:
          SCOPE: ${{ github.event.inputs.scope == null && env.DEFAULT_SCOPE || github.event.inputs.scope }}
        run: |
          set -euo pipefail
          out=mutants-run/mutants.out

          field() { python3 -c "import json,sys;print(json.load(open(sys.argv[1]))[sys.argv[2]])" "$out/outcomes.json" "$1"; }
          total=$(field total_mutants)
          caught=$(field caught)
          missed=$(field missed)
          timeout=$(field timeout)
          unviable=$(field unviable)
          # The scope is printed beside the numbers on purpose. There are two
          # mutation gates on this project and both get called "the mutation
          # gate": this one, over the RUST crate, and `hooks/tests/mutate.py`
          # over the python hook pack. A count from one has already been quoted
          # as coverage of the other. Neither number means anything without the
          # scope attached, so neither is ever printed without it.
          echo "gate: cargo-mutants over the RUST crate — scope $SCOPE"
          echo "      (the python hook pack is a separate campaign: hooks/tests/mutate.py)"
          echo "tested=$total caught=$caught missed=$missed timeout=$timeout unviable=$unviable"

          # A glob that stopped matching tests nothing, finds nothing, and looks
          # exactly like a clean run.
          if [ "$total" -lt "$MUTANT_FLOOR" ]; then
            echo "::error::only $total mutants were generated; the floor is $MUTANT_FLOOR."
            echo "::error::A --file glob that matches nothing produces zero"
            echo "::error::survivors and exits 0. Check the scope, not the tests."
            exit 1
          fi

          # The total alone cannot see ONE glob collapsing. `src/secret.rs` is
          # nine mutants out of three hundred, so renaming it drops the total by
          # three percent and sails past any floor loose enough to survive a
          # normal refactor — while silently removing the file where a wrong
          # answer leaves plaintext in freed memory from the scope entirely.
          # So every root in the scope has to be represented by name.
          python3 - "$out/outcomes.json" $SCOPE <<'SCOPED'
          import json, sys

          data = json.load(open(sys.argv[1]))
          roots = [glob.split('*')[0].rstrip('/') for glob in sys.argv[2:]]
          seen = set()
          for outcome in data['outcomes']:
              # The baseline scenario is the bare string "Baseline"; only a
              # mutant scenario is a mapping with a file in it.
              scenario = outcome.get('scenario')
              if isinstance(scenario, dict) and isinstance(scenario.get('Mutant'), dict):
                  name = scenario['Mutant'].get('file')
                  if name:
                      seen.add(name)
          missing = [r for r in roots if not any(f == r or f.startswith(r + '/') for f in seen)]
          if missing:
              for root in missing:
                  print('::error::no mutants were generated under %s' % root)
              print('::error::That path is in the scope and contributed nothing.')
              print('::error::It was renamed, deleted, or the glob stopped matching.')
              sys.exit(1)
          print('every scope root produced mutants: %s' % ', '.join(roots))
          SCOPED

          # Line and column stripped, identical keys collapsed with a count.
          # See the header for why the line number is deliberately not part of
          # the key, and what that costs.
          python3 - "$out/missed.txt" survivors.txt <<'NORMALISE'
          import collections, re, sys

          keys = collections.Counter()
          for raw in open(sys.argv[1]):
              raw = raw.strip()
              if raw:
                  keys[re.sub(r'^(.*?):[0-9]+:[0-9]+: ', r'\1: ', raw)] += 1
          with open(sys.argv[2], 'w') as fh:
              for key in sorted(keys):
                  fh.write('%d\t%s\n' % (keys[key], key))
          NORMALISE

          # The baseline describes the DEFAULT scope and nothing else. A
          # whole-crate run, or any hand-picked scope, produces a different set
          # by construction, so diffing it against this baseline would red every
          # single time and mean nothing — which would make the documented
          # "run the whole crate by hand" path useless on its first use.
          if [ "$SCOPE" != "$DEFAULT_SCOPE" ]; then
            echo "scope is not the default, so there is no baseline to diff against."
            echo "the survivors of this run, for a person to read:"
            cat survivors.txt
            exit 0
          fi

          grep -vE '^[[:space:]]*(#|$)' .github/mutants-baseline.txt > expected.txt || true

          if [ -s "$out/timeout.txt" ]; then
            echo "mutants that TIMED OUT (reported, never judged -- a timeout on"
            echo "a shared runner measures the neighbours):"
            cat "$out/timeout.txt"
          fi

          if diff -u expected.txt survivors.txt; then
            echo "the surviving mutants are exactly the $(wc -l < expected.txt | tr -d ' ') recorded in .github/mutants-baseline.txt"
            exit 0
          fi

          echo "::error::the set of surviving mutants changed."
          echo "::error::A line only in survivors.txt is a mutation NO TEST"
          echo "::error::NOTICES: the code was changed and the suite stayed"
          echo "::error::green. Write the guard, or -- if the mutant is"
          echo "::error::genuinely equivalent -- add it to the baseline WITH a"
          echo "::error::comment saying why it cannot be observed."
          echo "::error::A line only in expected.txt is the opposite: a gap"
          echo "::error::somebody closed while the baseline still claims it is"
          echo "::error::open. Delete that line."
          echo "::error::A changed COUNT on a line that is otherwise identical"
          echo "::error::means one of several identical mutations in that"
          echo "::error::function was closed, or a new one appeared."
          exit 1

      # The diff above names what changed; these are what a human reads to fix
      # it. Uploaded on failure only, because a passing run's artifacts are
      # megabytes of logs nobody opens.
      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: mutants-run
          path: |
            mutants.log
            mutants-run/mutants.out/missed.txt
            mutants-run/mutants.out/timeout.txt
            mutants-run/mutants.out/outcomes.json
          retention-days: 14
