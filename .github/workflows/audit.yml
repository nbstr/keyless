# Advisory scanning for the dependency tree.
#
# Separate from `ci.yml`, and on purpose.
#
# `cargo audit` answers a question no other check can: has anything *published*
# an advisory against a crate already in `Cargo.lock`? That happens without
# anybody pushing, so a check that only runs on push cannot see it — hence the
# schedule.
#
# It is equally deliberate that this does NOT run on every push. An advisory
# landing overnight would turn an unrelated pull request red, for something its
# author did not do and cannot fix in that branch. A gate that refuses correct
# work gets switched off, and then it protects nothing. So it runs:
#
#   * weekly, where a failure mails whoever owns the repository;
#   * on any change to `Cargo.toml` or `Cargo.lock`, where a new advisory IS
#     the author's business and blocking is the right answer;
#   * on demand.
#
# Why `cargo audit` and not `cargo deny`: the tree is 23 crates, every one of
# them MIT or Apache-2.0, so the licence and bans halves of `cargo deny` would
# be a `deny.toml` to maintain against a risk this dependency list does not
# have. Advisories are the half that pays for itself — `zeroize` is the
# scrubbing primitive and `nix` is every syscall, and a vulnerability in either
# is a vulnerability in the security property this tool claims.

name: audit

on:
  schedule:
    # Mondays, 07:00 UTC. A weekly cadence, because RustSec advisories are not
    # an hourly event and a daily red mail is a mail nobody reads.
    - cron: '0 7 * * 1'
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # `cargo-audit` is built from source rather than pulled from a third-party
      # action, for the same reason `ci.yml` uses none: this repository's whole
      # subject is not handing your credentials to something you did not read.
      # The cache is what stops that being a two-minute tax every week.
      - name: Cache cargo-audit
        id: cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-v1

      - name: Install cargo-audit
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      # `--deny warnings` promotes unmaintained and yanked crates to failures.
      # For a five-dependency tool that is affordable; for a large tree it would
      # be the noise that gets the job disabled.
      - name: Audit
        run: |
          set -uo pipefail
          cargo audit --deny warnings > audit.log 2>&1
          code=$?
          cat audit.log
          if [ "$code" -ne 0 ]; then
            echo "::error::cargo audit exited $code"
            exit "$code"
          fi
          # Exit 0 with an empty database would read exactly like a clean tree.
          # The summary line names how many crates were actually examined, so
          # assert it saw the tree rather than trusting the status.
          if ! grep -qE 'Scanning Cargo.lock for vulnerabilities \([0-9]+ crate dependencies\)' audit.log; then
            echo "::error::cargo audit did not report scanning any crates. An"
            echo "::error::advisory database that failed to load exits 0 and"
            echo "::error::reads exactly like a clean tree."
            exit 1
          fi
