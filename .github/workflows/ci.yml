# CI for keyless.
#
# The point of this file is that a stranger can see the green rather than read a
# claim about it. So every step below asserts a NUMBER or a NAMED FACT, never
# just "the command exited 0" — a filtered test run that matched nothing exits 0,
# a suite whose layers collapsed to zero checks exits 0, and a build that made no
# artifact can exit 0 too.
#
# ---------------------------------------------------------------------------
# The platform split, which is the whole reason this file has two shapes
# ---------------------------------------------------------------------------
#
# `keylessd`'s attestation is XNU. It calls `getpeereid`, `csops`,
# `proc_pidinfo` and `proc_pidpath`, all exported by libSystem and none of them
# present on Linux. `install/README.md` says the daemon is macOS-only and lists
# the Linux equivalents; this file is the mechanical half of that sentence.
#
# The crate draws that line at FOUR module boundaries and nowhere else --
# `ipc::ffi`, `ipc::peer::live`, `attest::live` and `daemon` -- each gated on
# `any(target_os = "macos", keyless_force_xnu)`. Everything a SESSION uses is
# portable: the client, the stores, the masking, the PTY and the never-block
# invariant all compile and are TESTED on both platforms.
#
# Measured on Linux (rust 1.89.0, aarch64-unknown-linux-gnu) on 2026-08-09:
#
#   cargo fmt --check                          exit 0
#   cargo clippy --all-targets -- -D warnings  exit 0
#   cargo build            (all targets)       exit 0
#   cargo build --bin keyless                  exit 0   debug and release
#   cargo build --bin keylessd                 exit 0   builds, then REFUSES at
#                                                       runtime, naming macOS
#   cargo test                                 exit 0   the whole portable suite
#   RUSTFLAGS=--cfg keyless_force_xnu \
#     cargo build --bin keylessd               exit 101 4 undefined references
#
# Three traps live in those numbers and this file avoids all three.
#
# 1. A daemon that is silently ABSENT from a Linux build is indistinguishable
#    from one that broke, and `command not found` teaches an operator nothing.
#    So `keylessd` is built on Linux and RUN, and the job requires it to exit
#    non-zero with a message naming `csops`. An absence is not asserted; a
#    refusal is.
#
# 2. Gating the daemon behind `target_os` alone would make its unportable
#    surface unmeasurable: a fifth macOS-only symbol could be added inside the
#    gated modules and no job on earth would notice, because Linux would never
#    compile them. `--cfg keyless_force_xnu` defeats the gate, so the link still
#    runs on Linux and is still REQUIRED to fail on exactly those four names. A
#    fifth name turns CI red. A successful link turns CI red. That assertion is
#    unchanged from the days when the daemon was compiled unconditionally; what
#    it gained is that it now ALSO proves the gate is drawn in the right place,
#    because anything gated that did not need to be would link fine here.
#
# 3. A suite that stops linking is a suite that stops running, and it reads as
#    an infrastructure problem rather than as lost coverage. Every test binary
#    used to link the four symbols, so ZERO Rust tests ran on Linux -- not a
#    failing suite, an absent one. They run now, under the same floor-and-count
#    assertions as macOS.
#
# ---------------------------------------------------------------------------
# What the second platform found -- nothing is skipped on Linux now
# ---------------------------------------------------------------------------
#
# Making the suite RUN on Linux found defects in code that is portable,
# compiled on both platforms, and shipped by the client build this file already
# produces. Both are fixed. The ignored count is now the same number on both
# platforms, and every remaining difference is a test file ABSENT off macOS
# rather than a test skipped there.
#
# The pty relay was one of them: `keyless run` kept its own copy of the pty
# slave for the life of the run, and a master reports end-of-stream only when
# the LAST slave closes, so the output filter blocked in `read` forever after
# the child was dead and reaped.
#
# It could not be caught on macOS, and no amount of green there would have said
# so. XNU REVOKES a controlling terminal when its session ends, which
# invalidates the leaked descriptor and hands the master an end-of-file that
# `keyless` never earned. Linux performs no such revoke. Measured 2026-08-09
# against the unfixed source with today's tests: 11 of 11 pty cases PASS on
# macOS, 10 of 11 FAIL on Linux. For this class Linux is not a second opinion,
# it is the only one.
#
# A hang REPORTS NOTHING -- `cargo test` never returns, which is why nine broken
# cases sat unnoticed. Every case in `tests/pty.rs` and `tests/hostile.rs` runs
# through `support::within`. Keep that wrapper on anything driving a child, a
# terminal, or a descriptor another process can hold open.
#
# The stdin deadline in `store::exec` was the other one, and it is fixed:
# `capture_with_input` no longer parks a thread inside a blocking write, so
# nothing there is ignored on either platform. Its lesson is worth more than
# its entry was. The case that guarded it PASSED on macOS against completely
# unbounded code, for a reason that has nothing to do with the code: macOS
# `/bin/sh` EXECs a single `-c` command, so killing the child closed the pipe
# by accident, while Debian's dash FORKS it and the grandchild kept the pipe
# open. One platform therefore reported a hang and the other reported a pass,
# from one defect and one test.
#
# **That is what the second platform is FOR.** A fixture whose validity rests
# on an undocumented detail of whichever shell the runner ships is not a
# fixture, and no amount of green on one operating system will say so. The
# replacement -- `tests/hostile.rs`, property 8 -- builds the reader that holds
# the pipe explicitly, so it discriminates identically on both.
#
# ---------------------------------------------------------------------------
# What is deliberately NOT here
# ---------------------------------------------------------------------------
#
# * A Linux daemon. There is no port of `csops`; `SO_PEERCRED` plus `/proc` is a
#   different design with different guarantees, and inventing one to make a test
#   suite greener would be the worst trade in this repository.
# * The hook pack's latency layer. It asserts `floor < 2.5 x a bare interpreter`
#   -- a RATIO against interpreter start time, which is a property of the
#   machine. On macOS a bare `python3 -c pass` costs ~19 ms and the pack's ~7 ms
#   of imports hide inside it (1.35x, passes). On Linux the interpreter starts in
#   ~4.6 ms and the same ~18 ms of imports read as 5.0x (fails). It is a
#   benchmark, and a benchmark on shared CI hardware measures the neighbours. It
#   runs on a developer machine; `--fast` is how CI says so out loud rather than
#   by omission, and the check-count assertion below is what stops anything
#   ELSE going quiet.
# * `secrets:` of any kind, and the 15 `#[ignore]` Proton tests that would need
#   one. Nothing here passes `--ignored`, and BOTH jobs assert that exactly 15
#   tests were ignored and 0 of them ran. The number is the same on both
#   platforms because `proton_live.rs` is portable; the macOS-only test files
#   are ABSENT off macOS rather than ignored, which is what keeps `ignored`
#   meaning exactly one thing.
#
# Third-party actions: none. `actions/checkout`, `actions/cache` and
# `actions/setup-python` are GitHub's own and are pinned by commit sha, because
# a tool whose subject is credential handling should not ask a stranger to trust
# a floating tag in its own build.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing until something fails, and a CI failure with no
  # backtrace costs a whole round trip.
  RUST_BACKTRACE: 1
  # The declared `rust-version` in Cargo.toml. Pinned rather than `stable`
  # because `clippy -D warnings` on a moving toolchain goes red on a release
  # nobody made — and a gate that fails for reasons unrelated to the change is
  # a gate that gets switched off.
  RUST_TOOLCHAIN: 1.89.0

jobs:
  # ---------------------------------------------------------------------------
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Per platform, because the macOS-only test files do not exist off
        # macOS. Each floor is set BELOW the measured count so it catches a
        # suite that collapsed rather than a suite that lost one case.
        # Measured 2026-08-09, by running both: 501 on macOS, 437 on Linux.
        include:
          - os: ubuntu-latest
            test-floor: 420
            # The Proton live suite, and nothing else -- the same number as
            # macOS, which is the point. Every remaining difference between the
            # two platforms is a test file ABSENT off macOS, never a test that
            # is skipped there. The pty cases were once ignored here; that was
            # a leaked descriptor in portable code, fixed, and they now run.
            ignored: 15
          - os: macos-latest
            test-floor: 480
            # The Proton live suite, and nothing else.
            ignored: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
          cargo clippy --version

      # `target/` is deliberately NOT cached, and that is a measurement rather
      # than an omission. Timed on 2026-08-08.
      #
      # Linux, 4 CPUs, everything in this job except the tests:
      #
      #   cold  (no registry, no target)     29s     target/ ends at 373 MB
      #   warm  (registry AND target)        17s
      #   registry only (target discarded)   28s
      #
      # macOS, the whole job including `cargo test`:
      #
      #   cold                               42s     target/ ends at 471 MB
      #   warm                               33s
      #
      # So `target/` buys about ten seconds and weighs several hundred megabytes.
      # Restoring and saving that much on a runner costs roughly what it saves,
      # and every push writes a fresh entry — a repository's cache budget is
      # 10 GB, so a few dozen pushes evict everything, including the entries that
      # were paying off. The registry is 25 MB, restores in about a second, and
      # is the half that cannot thrash.
      #
      # Re-measure before changing this. These numbers are small because the
      # dependency list is 23 crates; the day that stops being true, so does the
      # conclusion.
      - name: Cache the cargo registry
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Format
        run: cargo fmt --check

      # `--all-targets` reaches the tests, the examples and BOTH binaries, so on
      # Linux this is the step that actually reads the daemon. It runs `cargo
      # check` underneath and never links, which is exactly why it is portable
      # and exactly why it is not proof that the daemon builds. The next two
      # steps are that proof, one per platform.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Named, not `cargo build`. On Linux a bare `cargo build` exits 101 for
      # the daemon while this binary is already linked and on disk.
      - name: Build the client (debug and release)
        run: |
          set -euo pipefail
          cargo build --locked --bin keyless
          cargo build --locked --release --bin keyless
          ./target/release/keyless --version

      # ---- macOS: the daemon links --------------------------------------------

      - name: Build the daemon (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cargo build --locked --bin keylessd
          cargo build --locked --release --bin keylessd
          ./target/release/keylessd --version

      # ---- Both platforms: the suite runs, and its size is asserted ----------

      # ONE step for both, deliberately. Two near-identical shell blocks drift,
      # and the half that drifts is always the one nobody reads. The only thing
      # that differs is the floor, which is a matrix value.
      #
      # The exit code is judged on its own line. Never `cargo test | tail`: a
      # pipeline reports its LAST stage's status and `tail` always succeeds, so
      # a failing suite reads as green and the evidence is truncated as well.
      #
      # Then the counts, because exit 0 is not evidence that anything ran. A
      # filtered run that matches zero tests exits 0, and before the platform
      # gate existed a Linux `cargo test` could not link at all -- which is a
      # suite of zero, arriving as a build error rather than as a red test.
      #
      # The ignored count is asserted EXACTLY, per platform, and it is the line
      # that stops a gap going quiet. On macOS it is 15 -- the Proton live
      # suite, which needs a real account. On Linux it is 25, because ten more
      # tests cover code that is portable and CURRENTLY BROKEN there; they are
      # ignored rather than compiled out precisely so they stay countable.
      #
      # Nothing here passes `--ignored`. Pinning the number both ways means the
      # live tests cannot silently start running, and a Linux defect cannot
      # silently be joined by an eleventh.
      - name: Test
        run: |
          set -uo pipefail
          cargo test --locked > test.log 2>&1
          code=$?
          cat test.log
          if [ "$code" -ne 0 ]; then
            echo "::error::cargo test exited $code"
            exit "$code"
          fi
          count() {
            awk -v want="$1" '/^test result:/ {
                                for (i = 1; i <= NF; i++)
                                  if ($(i+1) == want) n += $i
                              }
                              END { print n + 0 }' test.log
          }
          passed=$(count 'passed;')
          ignored=$(count 'ignored;')
          failed=$(count 'failed;')
          echo "passed=$passed ignored=$ignored failed=$failed"
          if [ "$passed" -lt ${{ matrix.test-floor }} ]; then
            echo "::error::only $passed tests ran; the floor is ${{ matrix.test-floor }}."
            echo "::error::A suite that exercised nothing exits 0 and reads exactly"
            echo "::error::like a pass."
            exit 1
          fi
          if [ "$ignored" -ne ${{ matrix.ignored }} ]; then
            echo "::error::expected exactly ${{ matrix.ignored }} ignored tests on"
            echo "::error::${{ matrix.os }}; saw $ignored. Read the reason strings in"
            echo "::error::the log above -- each ignored test says why it is ignored."
            echo "::error::A macOS-only test file is ABSENT off macOS rather than"
            echo "::error::ignored, so this number counts only two things: the Proton"
            echo "::error::live suite, and known defects in portable code."
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed tests failed"
            exit 1
          fi

      # ---- Linux: the boundary, measured rather than asserted ----------------

      # The daemon binary EXISTS here and refuses. Asserted positively -- run it,
      # require a non-zero exit, and require the message to name the actual
      # reason -- because "the binary is missing" is a fact no job can tell apart
      # from a build that quietly broke.
      - name: keylessd builds on Linux and refuses to run, naming why
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          cargo build --locked --bin keylessd || exit 1
          ./target/debug/keylessd run > refusal.log 2>&1
          code=$?
          cat refusal.log
          if [ "$code" -eq 0 ]; then
            echo "::error::keylessd exited 0 on Linux. There is no daemon on this"
            echo "::error::platform, so a success here means something is pretending."
            exit 1
          fi
          for word in macOS csops proc_pidinfo install/README.md; do
            if ! grep -qF "$word" refusal.log; then
              echo "::error::the refusal never mentions '$word'. It is the only thing"
              echo "::error::an operator on this platform will read, so it has to name"
              echo "::error::the interface and point at the porting table."
              exit 1
            fi
          done
          echo "keylessd refuses on Linux, with exit $code, and says why."

      # The original assertion of this file, preserved exactly: run the link and
      # require it to fail on precisely the four XNU names. `keyless_force_xnu`
      # defeats the platform gate so that there is something to link at all.
      #
      # Without this step the gate would be an unfalsifiable claim -- see trap 2
      # in the header.
      - name: The daemon's unportable surface is exactly four XNU symbols
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: --cfg keyless_force_xnu
        run: |
          set -uo pipefail
          if cargo build --locked --bin keylessd > keylessd-link.log 2>&1; then
            cat keylessd-link.log
            echo "::error::keylessd LINKED on Linux with the XNU modules forced on."
            echo "::error::That is good news and this file is now wrong: give Linux"
            echo "::error::a real daemon job, and update the porting table in"
            echo "::error::install/README.md."
            exit 1
          fi
          cat keylessd-link.log
          sed -nE "s/.*undefined reference to \`([A-Za-z0-9_]+)'.*/\1/p" \
            keylessd-link.log | sort -u > got.txt
          if [ ! -s got.txt ]; then
            echo "::error::the forced build failed BEFORE linking, so the unportable"
            echo "::error::surface was never measured. Read keylessd-link.log: this is"
            echo "::error::a compile error under --cfg keyless_force_xnu, not a"
            echo "::error::portability finding."
            exit 1
          fi
          printf '%s\n' csops getpeereid proc_pidinfo proc_pidpath > want.txt
          if ! diff -u want.txt got.txt; then
            echo "::error::the daemon's unportable surface changed. It is meant to"
            echo "::error::be exactly the four XNU calls in src/ipc/ffi.rs. A new"
            echo "::error::name in this list is a new macOS-only dependency, and it"
            echo "::error::belongs in the porting table in install/README.md."
            exit 1
          fi
          echo "keylessd is macOS-only on exactly the four documented XNU symbols."

  # ---------------------------------------------------------------------------
  # The hook pack. Stdlib-only, so the only variable worth testing is the
  # interpreter.
  #
  # Floor measured on 2026-08-08 by running the suite, not by reading it: 3.7
  # through 3.13 are green at 514 checks; 3.6 fails one fail-open case under a
  # broken locale (it degrades to `silent` where every later version denies).
  #
  # CI's low end is 3.9, not the 3.7 floor, and that gap is a property of the
  # runners rather than of the pack. Counted in GitHub's `python-versions`
  # manifest on 2026-08-08: 3.7 has ZERO builds for `ubuntu-24.04` and zero for
  # arm64 macOS, while 3.9 has 14 and 2. Ask for a version a runner has no build
  # of and the job dies on the setup step, for a reason that has nothing to do
  # with this pack — so count the manifest before moving either number.
  hooks:
    name: hooks (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    steps:
      # `fetch-depth: 0` is load-bearing, not a default anybody copied.
      #
      # The publication layer scans every COMMIT MESSAGE for a measurement of
      # one machine or account, and the default shallow checkout hands it one
      # commit. One commit with nothing to flag reads exactly like a clean
      # history: no failure, no output, exit 0. The layer refuses a shallow
      # checkout outright for that reason, so dropping this line turns the gate
      # red rather than quiet -- which is the only safe direction for a check
      # whose clean verdict is an empty result.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python }}

      # No `pip install`. The pack is stdlib-only and a dependency appearing
      # here would be the first sign that stopped being true.
      - name: No third-party imports
        run: |
          set -euo pipefail
          python3 -c 'import sys; print(sys.version)'
          test ! -e hooks/requirements.txt
          test ! -e hooks/pyproject.toml
          test ! -e hooks/setup.py

      # `--fast` drops the latency layer only. See the header for why a ratio
      # against interpreter start time cannot be a gate on shared hardware.
      #
      # run.py already refuses a layer that ran fewer checks than its own floor,
      # which is the real guard. The total below is the cheap second one: it
      # catches a whole LAYER going missing from the runner's own list.
      - name: Hook pack suite
        run: |
          set -uo pipefail
          python3 hooks/tests/run.py --fast > hooks.log 2>&1
          code=$?
          cat hooks.log
          if [ "$code" -ne 0 ]; then
            echo "::error::the hook suite exited $code"
            exit "$code"
          fi
          checks=$(awk '/^[0-9]+ checks\./ { print $1 }' hooks.log)
          echo "checks=$checks"
          if [ "${checks:-0}" -lt 500 ]; then
            echo "::error::only ${checks:-0} checks ran; the floor is 500. A suite"
            echo "::error::that ran nothing prints ALL GREEN and exits 0."
            exit 1
          fi

      # The suites are meant to stand up their own stubs rather than depend on a
      # vendor CLI being installed, and a runner is where that is provable: it
      # has neither. If either name ever appears on a runner's PATH, this stops
      # being a proof and starts being a coincidence, so the job says so.
      - name: No vendor CLI is present, so nothing can quietly depend on one
        run: |
          set -euo pipefail
          for cli in infisical pass-cli; do
            if command -v "$cli" > /dev/null 2>&1; then
              echo "::error::$cli is on PATH on this runner. The suites are"
              echo "::error::supposed to prove themselves against stubs; with the"
              echo "::error::real binary here, a green run no longer proves that."
              exit 1
            fi
          done
          echo "neither infisical nor pass-cli is installed, as intended."
