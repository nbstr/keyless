# The suite, run somewhere it did not grow up.
#
# ---------------------------------------------------------------------------
# Why this is not "a pristine checkout job"
# ---------------------------------------------------------------------------
#
# It was asked for as one, and a pristine checkout job in GitHub Actions is a
# NO-OP. `actions/checkout` already produces exactly that: the tracked files at
# HEAD, in an empty directory, with no `target/`. Extracting `git archive HEAD`
# from it and building there proves nothing the `rust` job in `ci.yml` does not
# already prove, because the two trees are byte-identical.
#
# The green that failed to travel was never about the FILES. It was about
# everything around them. A developer machine differs from a runner in ways a
# second checkout cannot reach:
#
#   * uncommitted changes         -- CI cannot have them, by construction
#   * a warm or dirty `target/`   -- CI has neither
#   * leftover state in `/tmp`    -- from an earlier run of the same suite
#   * CPU load                    -- twenty parallel sessions, a mutation campaign
#   * a long `TMPDIR`             -- a nested worktree, a scratch directory
#   * a real `$HOME`              -- with dotfiles, caches and a login keychain
#   * vendor CLIs on `PATH`       -- `ci.yml` already asserts these are absent
#
# So this file varies the axes a runner can actually vary, and says plainly
# which ones it cannot.
#
# ---------------------------------------------------------------------------
# What it varies, and what each one catches
# ---------------------------------------------------------------------------
#
# 1. A LONG `TMPDIR`. `sockaddr_un.sun_path` is 104 bytes on macOS and 108 on
#    Linux. A socket named inside a scratch directory under `TMPDIR` therefore
#    binds on one machine and fails with `InvalidInput` on another, and NOTHING
#    about the code under test changed. Measured on macOS 15 on 2026-08-09 by
#    varying only `TMPDIR` against `cargo test`:
#
#      TMPDIR bytes   result
#                49   green            (the stock macOS value)
#                52   green
#                57   2 failed         (src/daemon)
#                82   3 failed         (+ src/store/daemon)
#                97   12 failed        (+ 9 in tests/daemon_degraded.rs)
#
#    Three bytes of headroom on a stock Mac, and twelve tests resting on it.
#    They are fixed -- every socket now comes from `support::short_socket_path`
#    -- and this job is what stops a thirteenth appearing. The failure it
#    catches is invisible at the default value on either runner.
#
# 2. AN EMPTY `HOME`. A suite that reads a real dotfile, a real config or a real
#    keychain item is one whose green belongs to the machine. `CARGO_HOME` and
#    `RUSTUP_HOME` are pinned to the runner's real ones on purpose: the subject
#    here is the SUITE's dependence on `$HOME`, not cargo's.
#
# 3. A tree built from `git archive HEAD` in a directory that never held a
#    `target/`. On a runner this is nearly free, as explained above -- it is
#    kept because it costs one step and it is the half a DEVELOPER can run, and
#    the whole point is that the developer's run and this one are the same
#    command.
#
# ---------------------------------------------------------------------------
# What this does NOT prove, which is the more useful half
# ---------------------------------------------------------------------------
#
# The suite is NOT hermetic and this job must not be read as saying it is. It
# still requires, and this list is not exhaustive:
#
#   * a kernel that speaks unix domain sockets, and a writable `/tmp`
#   * `/bin/sh`, and the coreutils the shell stubs call (`sed`, `cat`, `head`)
#   * a working `fork` + `exec`, fast enough that a stub answers inside its
#     deadline -- see `tests/suite_hygiene.rs`, which is the gate for that one,
#     because NO CI job can catch it: a runner is idle and the failure only
#     appears on a loaded machine
#   * on macOS, `/usr/bin/security` to exist as a path to stub over
#
# The honest claim is: **the suite passes from a tree containing exactly the
# tracked files, with no build cache, under an empty `HOME` and a `TMPDIR` long
# enough to break any socket named under it.** That is narrower than "hermetic"
# and it is what is actually checked.
#
# ---------------------------------------------------------------------------
# Why a separate file rather than a step in ci.yml
# ---------------------------------------------------------------------------
#
# `ci.yml` asserts the SIZE of the suite -- a floor and an exact ignored count
# per platform. Those numbers move whenever a test is added, and they have one
# owner. Repeating them here would create a second copy to forget, which is the
# drift `ci.yml`'s own Test step warns about in its comment. So this job
# asserts a floor and zero failures, and deliberately does NOT re-assert the
# ignored count: `ci.yml` owns that number, this file owns the environment.
#
# Third-party actions: none. `actions/checkout` and `actions/cache` are
# GitHub's own and are pinned by commit sha, matching `ci.yml`.

name: hostile env

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.89.0

jobs:
  environment:
    name: hostile env (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Set BELOW the measured count, so this catches a suite that collapsed
        # rather than a suite that lost one case. The exact figures live in
        # ci.yml, which owns them.
        include:
          - os: ubuntu-latest
            test-floor: 360
          - os: macos-latest
            test-floor: 420
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Cache the cargo registry
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      # The tree the suite will run from: exactly what `git archive HEAD`
      # produces, nothing else, in a directory that has never held a `target/`.
      # Asserted rather than assumed -- an empty archive extracts silently and a
      # build over nothing is not obviously different from a build that worked.
      - name: Extract a tree containing only the tracked files
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/from-archive"
          mkdir -p "$tree"
          git archive HEAD | tar -x -C "$tree"
          files=$(find "$tree" -type f | wc -l | tr -d ' ')
          echo "files=$files"
          if [ "$files" -lt 50 ]; then
            echo "::error::the archive extracted $files files. A tree this small"
            echo "::error::cannot be this repository, and a build over an empty"
            echo "::error::directory can still exit 0."
            exit 1
          fi
          # `Cargo.lock` rather than a list of test filenames: a filename
          # assertion here would be a second place to update on every rename,
          # and it buys nothing. A missing `tests/support/short_socket.rs`
          # fails the BUILD, and `tests/suite_hygiene.rs` is a test -- both
          # defend themselves.
          test -f "$tree/Cargo.lock"
          test -d "$tree/tests"
          if [ -e "$tree/target" ]; then
            echo "::error::the archive carried a target/ directory. Something"
            echo "::error::that should be build output is tracked."
            exit 1
          fi
          echo "$tree" > "$RUNNER_TEMP/tree.path"

      # The environment itself is asserted before it is used. A `TMPDIR` that
      # quietly stopped being long would make this job green for the wrong
      # reason -- it would simply be `ci.yml` again, run twice.
      - name: Build a hostile environment, and prove it is hostile
        run: |
          set -euo pipefail
          long="$RUNNER_TEMP/$(printf 'a%.0s' $(seq 1 72))/T"
          mkdir -p "$long"
          home="$RUNNER_TEMP/empty-home"
          mkdir -p "$home"
          bytes=$(printf %s "$long" | wc -c | tr -d ' ')
          echo "TMPDIR=$long"
          echo "TMPDIR bytes=$bytes"
          # 104 is macOS's sun_path. A socket built from this TMPDIR cannot fit,
          # whatever it is called, which is the property this job needs.
          if [ "$bytes" -lt 90 ]; then
            echo "::error::TMPDIR is only $bytes bytes. It has to be long enough"
            echo "::error::that ANY socket named under it exceeds sun_path (104),"
            echo "::error::or this job is just a second copy of ci.yml."
            exit 1
          fi
          echo "KL_TMPDIR=$long" >> "$GITHUB_ENV"
          echo "KL_HOME=$home" >> "$GITHUB_ENV"
          # Captured HERE, while `$HOME` is still the runner's own. The test
          # step replaces `HOME` for the child, and cargo would then look for
          # its registry inside the empty directory and re-download the world
          # -- or fail. The subject of this job is the SUITE's dependence on
          # `$HOME`, never cargo's.
          echo "KL_CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "KL_RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"

      # `--locked` because a lock file that is not respected is a lock file that
      # is decorative: it would let a transitive bump land in CI without a diff.
      #
      # `--no-fail-fast` because the whole subject of this job is a failure that
      # hits MANY tests at once for one environmental reason. Without it cargo
      # stops after the first test target that fails and never runs the rest, so
      # a break spanning four files reports as one -- measured on 2026-08-09,
      # where a deliberate three-part regression reported exactly one failing
      # test and hid the other eleven. The count then means "up to the first
      # broken target", which is not a count.
      #
      # The exit code is judged on its own line, and the log is redirected
      # rather than piped. A pipeline reports its LAST stage's status, so
      # `cargo test | tail` reports `tail`'s -- which always succeeds.
      - name: Test from the archived tree, empty HOME, long TMPDIR
        run: |
          set -uo pipefail
          tree=$(cat "$RUNNER_TEMP/tree.path")
          cd "$tree"
          env \
            HOME="$KL_HOME" \
            TMPDIR="$KL_TMPDIR" \
            CARGO_HOME="$KL_CARGO_HOME" \
            RUSTUP_HOME="$KL_RUSTUP_HOME" \
            cargo test --locked --no-fail-fast > test.log 2>&1
          code=$?
          cat test.log
          if [ "$code" -ne 0 ]; then
            echo "::error::cargo test exited $code from the archived tree."
            echo "::error::Read the failures above BEFORE assuming this job is"
            echo "::error::wrong: it differs from the rust job in ci.yml only by"
            echo "::error::HOME and TMPDIR, so a failure here that ci.yml does not"
            echo "::error::have is a test resting on one of those two."
            exit "$code"
          fi
          count() {
            awk -v want="$1" '/^test result:/ {
                                for (i = 1; i <= NF; i++)
                                  if ($(i+1) == want) n += $i
                              }
                              END { print n + 0 }' test.log
          }
          passed=$(count 'passed;')
          failed=$(count 'failed;')
          echo "passed=$passed failed=$failed"
          if [ "$passed" -lt ${{ matrix.test-floor }} ]; then
            echo "::error::only $passed tests ran; the floor is ${{ matrix.test-floor }}."
            echo "::error::A suite that exercised nothing exits 0 and reads exactly"
            echo "::error::like a pass."
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed tests failed"
            exit 1
          fi
